name: Server CI

on:
  push:
    branches:
      - master
      - dev

  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Nedis.Server.slnx

      - name: Build (Release)
        run: dotnet build Nedis.Server.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test src/tests/Nedis.Server.Modules.Identity.Tests/Nedis.Server.Modules.Identity.Tests.csproj
          --configuration Release --no-build --no-restore
          --logger "console;verbosity=normal"

  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify Docker
        run: docker info

      - name: Restore
        run: dotnet restore Nedis.Server.slnx

      - name: Build integration tests (Release)
        run: >-
          dotnet build
          src/tests/Nedis.Server.Modules.Identity.IntegrationTests/Nedis.Server.Modules.Identity.IntegrationTests.csproj
          --configuration Release --no-restore

      - name: Run integration tests
        run: >-
          dotnet test
          src/tests/Nedis.Server.Modules.Identity.IntegrationTests/Nedis.Server.Modules.Identity.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --logger "console;verbosity=normal"
