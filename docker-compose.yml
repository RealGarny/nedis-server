name: nedis

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: nedisroot
      POSTGRES_PASSWORD: nedis_password
      POSTGRES_DB: nedisdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nedisroot -d nedisdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
